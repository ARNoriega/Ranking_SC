[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smash-ranking"
version = "0.1.0"
description = "Pipeline modular para rankings de Smash Cantabria (traducción JSON + cálculo de rankings)."
authors = [{ name = "Smash Cantabria", email = "org@smashcantabria.es" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "python-dateutil>=2.9.0.post0",
  "pydantic>=2.5.0",          # contratos de datos / validación
  "typer>=0.12.0",            # interfaz CLI sencilla (opcional)
  "rich>=13.7.0",             # logs bonitos en consola
  "loguru>=0.7.2",            # logging flexible
  "pyyaml>=6.0.1",            # configuración si se desea .yaml
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",              # linting/format
  "black>=24.2.0",            # formateo
  "mypy>=1.8.0",              # tipado estático
  "ipykernel>=6.29.0"
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B"]
ignore = []